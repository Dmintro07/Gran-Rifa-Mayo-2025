
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gran Rifa Mayo 2025</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎉 Gran Rifa de Mayo 2025 🎉</h1>
    <p>Participa por solo <strong>S/20</strong> por número</p>
    <p><strong>Sorteo: 25 de mayo</strong></p>
  </header>

  <section class="formulario">
    <h2>📩 Reserva tu número</h2>
    <form id="rifaForm">
      <input type="text" id="nombre" placeholder="Tu nombre completo" required>
      <input type="number" id="numero" placeholder="Número elegido (1-400)" min="1" max="400" required>
      <input type="text" id="telefono" placeholder="Tu número de celular" required>
      <button type="submit">Enviar inscripción</button>
      <p id="estado" style="margin-top:10px;"></p>
    </form>
  </section>

  <footer>
    <p>© 2025 - Rifa organizada por Daniel</p>
  </footer>

  <script>
    const form = document.getElementById("rifaForm");
    const estado = document.getElementById("estado");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const data = {
        nombre: form.nombre.value.trim(),
        numero: form.numero.value.trim(),
        telefono: form.telefono.value.trim()
      };

      estado.textContent = "Enviando...";
      estado.style.color = "black";

      fetch("https://script.google.com/macros/s/AKfycbwkeLC2LMw1Ss2d8sgeKIU0u42goWgIwPcHwUHGl83m0cGCxCrxLI0Iux6tAx_qzaxo/exec", {
        method: "POST",
        body: JSON.stringify(data),
        headers: {
          "Content-Type": "application/json"
        }
      })
      .then(res => res.json())
      .then(response => {
        if (response.ok) {
          estado.textContent = "✅ Número registrado con éxito";
          estado.style.color = "green";
          form.reset();
        } else {
          estado.textContent = "⚠️ " + response.error;
          estado.style.color = "red";
        }
      })
      .catch(() => {
        estado.textContent = "❌ Error al enviar. Intenta más tarde.";
        estado.style.color = "red";
      });
    });
  </script>

<script>
  const listaOcupados = document.createElement("div");
  listaOcupados.id = "ocupados";
  listaOcupados.innerHTML = "<h3 style='margin-top:30px'>🔒 Números ya registrados:</h3><ul id='numerosUsados'></ul>";
  document.body.appendChild(listaOcupados);

  fetch("https://opensheet.elk.sh/1_K1IShAQ1fUrUxNqrh-R0zL2VKM0SQTGhI-EfKSaf_I/Respuestas")
    .then(res => res.json())
    .then(data => {
      const usados = data.map(f => f.Numero);
      const lista = document.getElementById("numerosUsados");
      if (usados.length === 0) {
        lista.innerHTML = "<li>Aún no hay inscripciones.</li>";
      } else {
        usados.sort((a, b) => Number(a) - Number(b));
        usados.forEach(num => {
          const li = document.createElement("li");
          li.textContent = "N° " + num;
          lista.appendChild(li);
        });
      }
    })
    .catch(() => {
      const lista = document.getElementById("numerosUsados");
      lista.innerHTML = "<li>No se pudieron cargar los datos.</li>";
    });
</script>

</body>
</html>
