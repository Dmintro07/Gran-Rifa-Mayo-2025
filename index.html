<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gran Rifa Mayo 2025</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎉 Gran Rifa de Mayo 2025 🎉</h1>
    <p>Participa por solo <strong>S/20</strong> por número</p>
    <p><strong>Sorteo: 25 de mayo</strong></p>
  </header>

  <section class="cronometro">
    <h2>⏳ Faltan:</h2>
    <div id="countdown"></div>
  </section>

  <section class="premios">
    <h2>🎁 Premios:</h2>
    <div class="grid">
      <div><img src="a.jpeg" alt="Caja de cervezas Pilsen"><p>Caja de cervezas Pilsen</p></div>
      <div><img src="b.jpeg" alt="Cocina Indurama"><p>Cocina Indurama</p></div>
      <div><img src="c.jpeg" alt="Smartwatch Xiaomi"><p>Smartwatch Xiaomi</p></div>
      <div><img src="d.jpeg" alt="Xiaomi Note 14 Pro"><p>Xiaomi Note 14 Pro</p></div>
    </div>
    <div class="efectivo">💵 + S/200 en efectivo</div>
  </section>

 <section class="formulario">
  <h2>📩 Reserva tu número</h2>
  <form id="rifaForm">
    <input type="text" id="nombre" placeholder="Tu nombre completo" required>
    <input type="number" id="numero" placeholder="Número elegido (1-400)" min="1" max="400" required>
    <input type="text" id="telefono" placeholder="Tu número de celular" required>
    <button type="submit">Enviar inscripción</button>
    <p id="estado" style="margin-top:10px;"></p>
  </form>
</section>

<script>
  const form = document.getElementById("rifaForm");
  const estado = document.getElementById("estado");

  form.addEventListener("submit", function(e) {
    e.preventDefault();
    const data = {
      nombre: form.nombre.value.trim(),
      numero: form.numero.value.trim(),
      telefono: form.telefono.value.trim()
    };

    estado.textContent = "Enviando...";
    estado.style.color = "black";

    fetch("https://script.google.com/macros/s/AKfycbwkeLC2LMw1Ss2d8sgeKIU0u42goWgIwPcHwUHGl83m0cGCxCrxLI0Iux6tAx_qzaxo/exec", {
      method: "POST",
      body: JSON.stringify(data),
      headers: {
        "Content-Type": "application/json"
      }
    })
    .then(res => res.json())
    .then(response => {
      if (response.ok) {
        estado.textContent = "✅ Número registrado con éxito";
        estado.style.color = "green";
        form.reset();
      } else {
        estado.textContent = "⚠️ " + response.error;
        estado.style.color = "red";
      }
    })
    .catch(() => {
      estado.textContent = "❌ Error al enviar. Intenta más tarde.";
      estado.style.color = "red";
    });
  });
</script>
